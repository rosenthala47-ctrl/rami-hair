name: Deploy storefront to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/dropshipping-ai-agents-system-ks572h
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: store/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Ensure R2 cache bucket exists
        working-directory: store/apps/storefront
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler r2 bucket create rami-hair-storefront-opennext-cache

      - name: Build for Cloudflare Workers
        working-directory: store/apps/storefront
        env:
          # Placeholder fallbacks keep the build green before the Medusa Cloud
          # backend exists - the storefront's check-env-variables.js hard-fails
          # on an empty publishable key. Set the repository variables (Settings >
          # Secrets and variables > Actions > Variables) once the backend is live
          # and the next push picks up the real values automatically.
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL || 'https://backend-not-configured.invalid' }}
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY || 'pk_set_this_repository_variable' }}
          NEXT_PUBLIC_DEFAULT_REGION: ${{ vars.NEXT_PUBLIC_DEFAULT_REGION || 'dk' }}
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_STRIPE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_KEY }}
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        working-directory: store/apps/storefront
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx opennextjs-cloudflare deploy
